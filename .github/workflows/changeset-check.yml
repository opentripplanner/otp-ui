name: Changeset Check

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  changeset-status:
    # The version PR consumes changesets and is covered by Node.js CI.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'changeset-release/master'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v2
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require a changeset or explicit empty changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset:status --since="origin/$BASE_REF"
