name: Node.js CI

"on":
  pull_request: null
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v2
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint code
        run: pnpm run lint:js
      - name: Lint styles
        run: pnpm run lint:styles
      - name: Run type check and build packages
        run: pnpm run build-all
      - name: i18n check (en-US, fr only)
        run: pnpm run check:i18n-en-fr
      - name: Run unit tests
        run: pnpm run unit
      - name: Build Storybook
        run: pnpm run build-storybook --quiet
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps
      - name: Serve Storybook and run snapshot and a11y tests
        # We have to run the snapshot and a11y tests together
        # Because Jest will fail if there are obsolete snapshots
        # And you would get obsolete snapshots from running the a11y tests alone
        # env: 
        #   ONLY_RUN: SNAPSHOTS
        run: |
          pnpx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
            "pnpx http-server storybook-static --port 5555 --silent" \
            "pnpx wait-on tcp:5555 && pnpm run test-storybook --ci"
      # - name: Serve Storybook and run a11y tests
      #   env: 
      #     ONLY_RUN: A11Y
      #   run: |
      #     npx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
      #       "npx http-server storybook-static --port 5555 --silent" \
      #       "npx wait-on tcp:5555 && pnpm run test-storybook --ci"

  release:
    needs: test-build-release
    if: >-
      github.event_name == 'push' &&
      github.repository == 'opentripplanner/otp-ui' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: changesets-version-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v2
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Open a version PR or publish packages
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
